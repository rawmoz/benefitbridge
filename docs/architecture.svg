<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">BenefitBridge SoCal — architecture</text>

  <!-- User -->
  <rect x="40" y="270" width="180" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="130" y="312" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">Resident</text>
  <text x="130" y="336" font-size="13" fill="#475569" text-anchor="middle">phone or laptop</text>
  <text x="130" y="356" font-size="13" fill="#475569" text-anchor="middle">English / Español</text>

  <!-- Vultr Cloud Compute -->
  <rect x="270" y="70" width="620" height="560" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="294" y="102" font-size="16" font-weight="700" fill="#0f766e">Vultr Cloud Compute · Los Angeles</text>
  <text x="294" y="122" font-size="13" fill="#475569">Docker container · Next.js 15 (React 19, Tailwind, TypeScript)</text>

  <!-- UI -->
  <rect x="300" y="140" width="560" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="168" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Chat + results UI</text>
  <text x="580" y="188" font-size="12.5" fill="#64748b" text-anchor="middle">src/app/page.tsx · programs, documents checklist, local help</text>

  <!-- API route -->
  <rect x="300" y="232" width="560" height="374" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="258" font-size="14" font-weight="600" fill="#0f172a">POST /api/chat</text>
  <text x="840" y="258" font-size="12.5" fill="#64748b" text-anchor="end">src/app/api/chat/route.ts · rate limited</text>

  <!-- Step 1 -->
  <rect x="330" y="276" width="500" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="304" font-size="15" font-weight="600" fill="#1e3a8a">1 · Intake (LLM)</text>
  <text x="350" y="327" font-size="12.5" fill="#334155">asks one question at a time → household profile JSON</text>

  <!-- Step 2 -->
  <rect x="330" y="378" width="500" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="406" font-size="15" font-weight="600" fill="#78350f">2 · Rules engine (no AI)</text>
  <text x="350" y="428" font-size="12.5" fill="#334155">src/lib/eligibility.ts · deterministic, testable</text>
  <text x="350" y="452" font-size="12.5" fill="#334155">data/programs.json · fpl.json · counties.json</text>
  <text x="350" y="469" font-size="11.5" fill="#64748b">each rule: official source URL + last-verified date</text>

  <!-- Step 3 -->
  <rect x="330" y="508" width="500" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="536" font-size="15" font-weight="600" fill="#1e3a8a">3 · Explain (LLM)</text>
  <text x="350" y="559" font-size="12.5" fill="#334155">plain-language summary in the user's language</text>

  <!-- Inference -->
  <rect x="950" y="300" width="210" height="210" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1055" y="352" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Vultr Serverless</text>
  <text x="1055" y="374" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Inference</text>
  <text x="1055" y="408" font-size="12.5" fill="#334155" text-anchor="middle">deepseek-v4.1-flash</text>
  <text x="1055" y="428" font-size="12.5" fill="#334155" text-anchor="middle">OpenAI-compatible API</text>
  <text x="1055" y="460" font-size="11.5" fill="#64748b" text-anchor="middle">src/lib/llm.ts</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M220 310 C 250 310, 260 172, 298 172" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M580 204 L580 230" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M580 348 L580 376" marker-end="url(#a)"/>
    <path d="M580 478 L580 506" marker-end="url(#a)"/>
    <path d="M830 312 C 890 312, 900 360, 948 360" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M830 544 C 890 544, 900 450, 948 450" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text x="196" y="236" font-size="12" fill="#475569">chat</text>
  <text x="590" y="367" font-size="11.5" fill="#64748b">profile</text>
  <text x="590" y="497" font-size="11.5" fill="#64748b">matched programs</text>

  <text x="40" y="660" font-size="14" fill="#0f172a"><tspan font-weight="700">The AI never decides eligibility.</tspan> It only talks with the user and explains results; the rules engine makes every call from versioned data.</text>
</svg>
